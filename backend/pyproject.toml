[tool.poetry]
name = "strategylab"
version = "0.1.0"
description = "基于LLM的A股策略验证工具"
authors = ["Xu Ang <axu25@stu.pku.edu.cn>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
numpy = "^2.2.0"
pandas = "^2.2.0"
backtrader = "^1.9.78"
akshare = "^1.15.0"
python-dotenv = "^1.0.0"
aiohttp = "^3.11.0"
openai = "^1.60.0"
pyarrow = "^19.0.0"
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
redis = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
black = "^25.0.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
